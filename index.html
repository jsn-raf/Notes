<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <title>Quick Notes</title>

  <link rel="manifest" href="/Notes/manifest.webmanifest">
  <meta name="theme-color" content="#f5f6f7">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    body{
      font-family:'Segoe UI', Roboto, sans-serif;
      margin:0;
      background:#fff;
      color:#202124;
      overflow:hidden;
      -webkit-tap-highlight-color:transparent;
    }
    .toolbar{
      background:#f5f6f7;
      padding:15px;
      display:flex;
      align-items:center;
      border-bottom:1px solid #e3e5e7;
      height:50px;
      position:relative;
      touch-action:manipulation;
      user-select:none;
      -webkit-user-select:none;
      -webkit-touch-callout:none;
    }
    .back-arrow{
      font-size:20px;
      color:#5f6368;
      cursor:pointer;
      padding:8px 10px;
      margin:-8px -10px;
      z-index:3;
    }
    .title{
      font-weight:500;
      margin-left:20px;
      pointer-events:none;
    }
    .calc-trigger{
      position:absolute;
      right:6px;
      top:50%;
      transform:translateY(-50%);
      width:44px;
      height:44px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }
    .dots{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:3px;
    }
    .vdot{
      width:4px;
      height:4px;
      border-radius:50%;
      background:#5f6368;
      opacity:0.65;
    }
    .calc-trigger.armed-top .vdot.top{ background:#202124; opacity:1; }
    .calc-trigger.armed-mid .vdot.mid{ background:#202124; opacity:1; }
    .calc-trigger.armed-bottom .vdot.bottom{ background:#202124; opacity:1; }

    .peek-arrow{
      position:absolute;
      left:28px;
      top:50%;
      transform:translateY(-50%);
      display:none;
      pointer-events:none;
      font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size:12px;
      font-weight:700;
      letter-spacing:0.02em;
      color:#202124;
      z-index:2;
      text-align:right;
      min-width:3ch;
    }
    .peek-arrow .card{ display:block; }
    .peek-arrow .shift{ display:block; margin-top:9px; }

    .note-area{ padding:20px; }
    .note-body{
      font-size:18px;
      border:none;
      outline:none;
      width:100%;
      min-height:calc(100vh - 120px);
      resize:none;
      line-height:1.6;
      background:transparent;
      color:#202124;
      caret-color:#202124;
      -webkit-overflow-scrolling:touch;
    }

    body.modal-open .toolbar,
    body.modal-open .note-area{
      pointer-events:none;
    }

    .about-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.06);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:50;
    }
    .about-card{
      width:calc(100% - 72px);
      max-width:420px;
      background:#fff;
      border-radius:10px;
      padding:16px 16px 14px;
      box-shadow:0 6px 18px rgba(0,0,0,0.10);
      cursor:pointer;
    }
    .about-title{ font-size:14.5px; font-weight:500; margin:0 0 10px 0; }
    .about-body{ font-size:13.5px; line-height:1.45; }
    .about-footer{ margin-top:10px; font-size:12px; line-height:1.35; color:#6b7077; }
  </style>
</head>

<body>
  <div class="toolbar" id="toolbarBtn">
    <span class="back-arrow" id="resetBtn">←</span>

    <div class="peek-arrow" id="peekArrow" aria-hidden="true">
      <span class="card" id="peekCard"></span>
      <span class="shift" id="peekShift"></span>
    </div>

    <span class="title">Quick Notes</span>

    <div class="calc-trigger" id="aboutBtn" aria-label="More options">
      <div class="dots">
        <span class="vdot top"></span>
        <span class="vdot mid"></span>
        <span class="vdot bottom"></span>
      </div>
    </div>
  </div>

  <div class="note-area">
    <textarea id="noteContent" class="note-body" placeholder="Start typing…"></textarea>
  </div>

  <div class="about-overlay" id="aboutOverlay" aria-hidden="true">
    <div class="about-card" id="aboutCard">
      <div class="about-title">Quick Notes</div>
      <div class="about-body">
        <p>
          A simple note-taking utility. Clutter-free design.
          All content is stored locally on your device. Account registration is not required.
          No unnecessary features.
        </p>
        <div class="about-footer">
          Build 1.3-g4l4h4d · Jan 2026<br>
          © Jason Parry
        </div>
      </div>
    </div>
  </div>

  <script>
    "use strict";

    /* Wake Lock (best-effort, no UI) */
    let wakeLock = null;
    let wakeLockEnabled = false;

    async function requestWakeLock() {
      if (!("wakeLock" in navigator)) return;
      try {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      } catch (_) {}
    }

    function enableWakeLockOnce() {
      if (wakeLockEnabled) return;
      wakeLockEnabled = true;
      requestWakeLock();
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        if (wakeLockEnabled) requestWakeLock();
      } else {
        if (wakeLock) wakeLock.release().catch(() => {});
      }
    });

    /* Constants */
    const HOLD_MS = 650;
    const MOVE_TOL = 10;

    /* DOM */
    const toolbarBtn = document.getElementById("toolbarBtn");
    const resetBtn = document.getElementById("resetBtn");
    const aboutBtn = document.getElementById("aboutBtn");
    const aboutOverlay = document.getElementById("aboutOverlay");
    const aboutCard = document.getElementById("aboutCard");
    let noteContent = document.getElementById("noteContent");

    const peekArrow = document.getElementById("peekArrow");
    const peekCard = document.getElementById("peekCard");
    const peekShift = document.getElementById("peekShift");

    /* Stack (cyclic) */
    const stack = [
      "4C","2H","7D","3C","4H","6D","AS","5H","9S","2S","QH","3D",
      "QC","8H","6S","5S","9H","KC","2D","JH","3S","8S","6H","10C",
      "5D","KD","2C","3H","8D","5C","KS","JD","8C","10S","KH","JC",
      "7S","10H","AD","4S","7H","4D","AC","9C","JS","QD","7C","QS",
      "10D","6C","AH","9D"
    ];

    /* State */
    let lastOutCard = null;
    let lastOutShift = null;
    let lastSnapshot = null;
    let isDirty = true;

    let holdTimer = null;
    let peeked = false;
    let startX = 0, startY = 0;
    let activePointerId = null;

    /* Parsing: cards */
    const suitWord = { SPADES:"S",HEARTS:"H",DIAMONDS:"D",CLUBS:"C",SPADE:"S",HEART:"H",DIAMOND:"D",CLUB:"C" };
    const rankWord = { ACE:"A",KING:"K",QUEEN:"Q",JACK:"J",TEN:"10",NINE:"9",EIGHT:"8",SEVEN:"7",SIX:"6",FIVE:"5",FOUR:"4",THREE:"3",TWO:"2" };
    const suitSym  = { "♠":"S","♥":"H","♦":"D","♣":"C" };

    /* Parsing: word numbers (1–52), incl “fourty” */
    const units = {
      ONE:1, TWO:2, THREE:3, FOUR:4, FIVE:5, SIX:6, SEVEN:7, EIGHT:8, NINE:9,
      TEN:10, ELEVEN:11, TWELVE:12, THIRTEEN:13, FOURTEEN:14, FIFTEEN:15,
      SIXTEEN:16, SEVENTEEN:17, EIGHTEEN:18, NINETEEN:19
    };
    const tens = { TWENTY:20, THIRTY:30, FORTY:40, FOURTY:40, FIFTY:50 };

    /* UI helpers */
    function clearDots(){
      aboutBtn.classList.remove("armed-top","armed-mid","armed-bottom");
    }
    function setDot(mode){
      clearDots();
      aboutBtn.classList.add("armed-" + mode);
    }

    function showPeek(){
      if(!noteContent.value.trim() || !lastOutCard) return;
      peekCard.textContent = lastOutCard;
      peekShift.textContent = lastOutShift;
      peekArrow.style.display = "block";
      peekArrow.setAttribute("aria-hidden","false");
    }
    function hidePeek(){
      peekArrow.style.display = "none";
      peekArrow.setAttribute("aria-hidden","true");
      peekCard.textContent = "";
      peekShift.textContent = "";
      /* Tiny improvement: do NOT clear dots here. */
    }

    /* Generic helpers */
    function removeSpan(s,a,b){
      return (s.slice(0,a) + s.slice(b)).replace(/\s{2,}/g," ").trimEnd();
    }

    function buildDeck(bottom){
      if(!bottom) return stack.slice();
      const i = stack.indexOf(bottom);
      if(i < 0) return null;
      return stack.slice(i + 1).concat(stack.slice(0, i + 1));
    }

    /* Find first card span in text: supports compact/symbol and word forms */
    function findCardSpan(text){
      if(!text) return null;

      const compact = /(10|[2-9AJQK])\s*([CDHS♠♥♦♣])/ig;
      let m;
      while((m = compact.exec(text))){
        const r = m[1].toUpperCase();
        const s = suitSym[m[2]] || m[2].toUpperCase();
        const code = r + s;
        if(/^(10|[2-9AJQK])[CDHS]$/.test(code))
          return { code, start: m.index, end: m.index + m[0].length, kind:"compact" };
      }

      const tokenRe = /[A-Za-z0-9♠♥♦♣]+/g;
      let rank = null, suit = null, rs = null, ss = null, t;
      while((t = tokenRe.exec(text))){
        const u = t[0].toUpperCase();
        if(!rank && (rankWord[u] || /^(10|[2-9])$/.test(u) || /^[AJQK]$/.test(u))){
          rank = rankWord[u] || u;
          rs = { s: t.index, e: t.index + t[0].length };
        }
        if(!suit && (suitWord[u] || suitSym[t[0]])){
          suit = suitWord[u] || suitSym[t[0]];
          ss = { s: t.index, e: t.index + t[0].length };
        }
        if(rank && suit) break;
      }
      if(!rank || !suit) return null;

      const code = rank + suit;
      if(!/^(10|[2-9AJQK])[CDHS]$/.test(code)) return null;
      return { code, start: Math.min(rs.s, ss.s), end: Math.max(rs.e, ss.e), kind:"word" };
    }

    /* Find first position span in line: digits or word numbers */
    function findPositionSpan(line){
      if(!line) return null;

      const d = /\d+/.exec(line);
      if(d){
        const v = parseInt(d[0], 10);
        if(v >= 1 && v <= 52) return { v, start: d.index, end: d.index + d[0].length };
      }

      const toks = [];
      const re = /[A-Za-z]+(?:-[A-Za-z]+)*/g;
      let m;
      while((m = re.exec(line))){
        const raw = m[0];
        const parts = raw.split("-").filter(Boolean);
        if(parts.length === 0) continue;
        toks.push({ w: parts.join(" ").toUpperCase(), start: m.index, end: m.index + raw.length });
      }

      for(let i = 0; i < toks.length; i++){
        const w = toks[i].w;

        if(units[w] != null){
          const v = units[w];
          if(v >= 1 && v <= 52) return { v, start: toks[i].start, end: toks[i].end };
        }

        if(tens[w] != null){
          let v = tens[w];
          let end = toks[i].end;

          const next = toks[i + 1];
          if(next && units[next.w] != null){
            v += units[next.w];
            end = next.end;
          }

          if(v >= 1 && v <= 52) return { v, start: toks[i].start, end };
        }

        if(w.includes(" ")){
          const parts = w.split(" ").filter(Boolean);
          let v = 0;
          for(const p of parts){
            if(tens[p] != null) v += tens[p];
            else if(units[p] != null) v += units[p];
            else { v = 0; break; }
          }
          if(v >= 1 && v <= 52) return { v, start: toks[i].start, end: toks[i].end };
        }
      }

      return null;
    }

    /* Compact/symbol-only LAST card span in original text */
    function findLastCompactCardSpan(text){
      if(!text) return null;
      const matches = [];
      const re = /(10|[2-9AJQK])\s*([CDHS♠♥♦♣])/ig;
      let m;
      while((m = re.exec(text))){
        const r = m[1].toUpperCase();
        const s = suitSym[m[2]] || m[2].toUpperCase();
        const code = r + s;
        if(/^(10|[2-9AJQK])[CDHS]$/.test(code)){
          matches.push({ code, start: m.index, end: m.index + m[0].length });
        }
      }
      return matches.length ? matches[matches.length - 1] : null;
    }

    /* Parse spectator input from first two non-empty lines:
       - card+position in any order
       - allows both on one line
       - does NOT try to be clever if spectator adds extra text (you'll manage this)
    */
    function parseSpectator(rawLines){
      const idxs = [];
      for(let i = 0; i < rawLines.length && idxs.length < 2; i++){
        if(String(rawLines[i] ?? "").trim() !== "") idxs.push(i);
      }
      if(idxs.length === 0) return null;

      const l1i = idxs[0];
      const l2i = idxs.length > 1 ? idxs[1] : null;

      const l1 = String(rawLines[l1i] ?? "");
      const l2 = l2i != null ? String(rawLines[l2i] ?? "") : "";

      // try within line 1 first
      let card = findCardSpan(l1);
      let pos  = findPositionSpan(l1);

      // if missing, try line 2
      if(!card && l2i != null) card = findCardSpan(l2);
      if(!pos  && l2i != null) pos  = findPositionSpan(l2);

      if(!card || !pos) return null;

      // also capture where we found them
      const c1 = card && l1 && (findCardSpan(l1)?.code === card.code) ? findCardSpan(l1) : null;
      const p1 = pos  && l1 && (findPositionSpan(l1)?.v === pos.v) ? findPositionSpan(l1) : null;

      const c2 = (!c1 && l2i != null) ? findCardSpan(l2) : null;
      const p2 = (!p1 && l2i != null) ? findPositionSpan(l2) : null;

      return { cardCode: card.code, posValue: pos.v, l1i, l2i, l1, l2, c1, c2, p1, p2 };
    }

    /* Detect bottom (Option A supported):
       1) line 3 (any valid card) => bottom dot, delete line 3
       2) else inline operator bottom as LAST compact card token in line 1 or 2 => middle dot, delete just that token
          - includes: "17" / "AS KD"
          - includes: "AS 17 KD"
          - includes duplicates where bottom == named (allowed)
    */
    function detectBottom(rawLines, spec){
      // 1) explicit bottom line (3rd line)
      if(rawLines.length >= 3 && String(rawLines[2] ?? "").trim() !== ""){
        const b = findCardSpan(String(rawLines[2]));
        if(!b) return null;
        return { bottomCode: b.code, source: "bottom", delete: { type: "line3" } };
      }

      // Helper: decide whether a last compact card on this line is an operator bottom
      function inlineBottomFromLine(lineText, lineIndex, usedCardSpan, usedPosSpan){
        const last = findLastCompactCardSpan(lineText);
        if(!last) return null;

        // Must be at the end (ignoring trailing spaces)
        const tailRe = new RegExp(String(last.code).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\s*$", "i");
        if(!tailRe.test(lineText)) return null;

        // Remove spectator spans (if on this line) AND remove this last token,
        // then confirm we can still parse one card + one number from spectator zone overall.
        // This keeps it deterministic and supports "17" / "AS KD" and duplicates.
        let scrub = lineText;

        // remove last token first (higher index safe)
        const withoutLast = removeSpan(scrub, last.start, last.end);

        // now check that, in the overall two-line spectator zone, we can still parse card+pos
        const tempLines = rawLines.slice();
        tempLines[lineIndex] = withoutLast;
        const tempSpec = parseSpectator(tempLines);
        if(!tempSpec) return null;

        // Accept as bottom (even if equals named card)
        return { bottomCode: last.code, lineIndex, span: { s: last.start, e: last.end } };
      }

      // Prefer applying inline bottom on line 2 if it exists, else line 1
      const candidates = [];

      const l1 = String(rawLines[spec.l1i] ?? "");
      const c1 = inlineBottomFromLine(l1, spec.l1i, spec.c1, spec.p1);
      if(c1) candidates.push(c1);

      if(spec.l2i != null){
        const l2 = String(rawLines[spec.l2i] ?? "");
        const c2 = inlineBottomFromLine(l2, spec.l2i, spec.c2, spec.p2);
        if(c2) candidates.push(c2);
      }

      if(!candidates.length) return null;

      // Prefer line 2
      candidates.sort((a,b)=> (a.lineIndex === spec.l2i ? -1 : 1) - (b.lineIndex === spec.l2i ? -1 : 1));
      const chosen = candidates[0];

      return {
        bottomCode: chosen.bottomCode,
        source: "mid",
        delete: { type: "span", lineIndex: chosen.lineIndex, span: chosen.span }
      };
    }

    function applyDeletion(rawLines, del){
      if(!del) return;

      if(del.type === "line3"){
        noteContent.value = String(rawLines[0] ?? "") + "\n" + String(rawLines[1] ?? "");
        return;
      }

      if(del.type === "span"){
        const i = del.lineIndex;
        const line = String(rawLines[i] ?? "");
        rawLines[i] = removeSpan(line, del.span.s, del.span.e);
        noteContent.value = rawLines.join("\n");
      }
    }

    function compute(){
      if(!isDirty && lastSnapshot === noteContent.value) return;

      const rawLines = noteContent.value.split("\n");

      const spec = parseSpectator(rawLines);
      if(!spec) return;

      const bottomInfo = detectBottom(rawLines, spec);
      const bottomCode = bottomInfo ? bottomInfo.bottomCode : null;

      const deck = buildDeck(bottomCode);
      if(!deck) return;

      const cur = deck.indexOf(spec.cardCode) + 1;
      if(cur <= 0) return;

      const diff = cur - spec.posValue;
      if(diff === 0){
        lastOutCard = "00";
        lastOutShift = "0";
      }else{
        let sh = diff % 52;
        if(sh < 0) sh += 52;
        lastOutCard = deck[sh - 1];
        lastOutShift = String(sh);
      }

      // Apply deletion only on success
      if(bottomInfo && bottomInfo.delete){
        applyDeletion(rawLines, bottomInfo.delete);
      }

      // Dots: top=no bottom, mid=inline bottom, bottom=line3 bottom
      if(!bottomInfo) setDot("top");
      else if(bottomInfo.source === "bottom") setDot("bottom");
      else setDot("mid");

      lastSnapshot = noteContent.value;
      isDirty = false;
    }

    function onNoteInput(){
      isDirty = true;
      lastOutCard = null;
      lastOutShift = null;
      hidePeek();
      clearDots();
    }

    function replaceTextarea(){
      const old = noteContent;
      const n = old.cloneNode(false);
      n.value = "";
      n.id = old.id;
      n.className = old.className;
      n.placeholder = old.placeholder;
      old.parentNode.replaceChild(n, old);
      noteContent = n;
      noteContent.addEventListener("input", onNoteInput);
      requestAnimationFrame(()=>{ noteContent.blur(); });
    }

    function openAbout(){
      hidePeek();
      if(noteContent && typeof noteContent.blur === "function") noteContent.blur();
      document.body.classList.add("modal-open");
      aboutOverlay.style.display = "flex";
      aboutOverlay.setAttribute("aria-hidden","false");
      requestAnimationFrame(()=>{ if(document.activeElement) document.activeElement.blur(); });
    }

    function closeAbout(){
      aboutOverlay.style.display = "none";
      aboutOverlay.setAttribute("aria-hidden","true");
      document.body.classList.remove("modal-open");
    }

    function clearHold(pointerId){
      if(holdTimer){
        clearTimeout(holdTimer);
        holdTimer = null;
      }
      hidePeek();
      peeked = false;

      if(pointerId != null){
        try{ toolbarBtn.releasePointerCapture(pointerId); }catch(_){}
      }
      if(pointerId === activePointerId) activePointerId = null;
    }

    /* Event wiring */
    noteContent.addEventListener("input", onNoteInput);

    ["pointerdown","pointerup","click"].forEach(ev=>{
      aboutBtn.addEventListener(ev, e=>{
        e.preventDefault();
        e.stopPropagation();
      });
    });

    aboutBtn.addEventListener("click", ()=>{
      if(aboutOverlay.style.display === "flex") closeAbout();
      else openAbout();
    });
    aboutOverlay.addEventListener("click", closeAbout);
    aboutCard.addEventListener("click", e=>{
      e.stopPropagation();
      closeAbout();
    });

    toolbarBtn.addEventListener("pointerdown", (e)=>{
      enableWakeLockOnce();

      if(e.target.closest("#aboutBtn") || e.target.closest("#resetBtn")) return;

      activePointerId = e.pointerId;
      try{ toolbarBtn.setPointerCapture(activePointerId); }catch(_){}

      clearHold();
      peeked = false;

      startX = e.clientX;
      startY = e.clientY;

      holdTimer = setTimeout(()=>{
        peeked = true;
        showPeek();
      }, HOLD_MS);
    });

    toolbarBtn.addEventListener("pointermove", (e)=>{
      if(!holdTimer) return;
      if(Math.abs(e.clientX - startX) > MOVE_TOL || Math.abs(e.clientY - startY) > MOVE_TOL){
        clearHold(activePointerId);
      }
    });

    toolbarBtn.addEventListener("pointerup", (e)=>{
      const wasPeeked = peeked;
      clearHold(e.pointerId);
      if(!wasPeeked) compute();
    });

    toolbarBtn.addEventListener("pointercancel", (e)=>{ clearHold(e.pointerId); });
    toolbarBtn.addEventListener("lostpointercapture", (e)=>{ clearHold(e.pointerId); });

    document.addEventListener("visibilitychange", ()=>{
      if(document.hidden) clearHold(activePointerId);
    });
    window.addEventListener("pagehide", ()=>{ clearHold(activePointerId); });

    resetBtn.addEventListener("click", ()=>{
      noteContent.value = "";
      hidePeek();
      lastOutCard = null;
      lastOutShift = null;
      clearDots();
      isDirty = true;
      lastSnapshot = null;
      requestAnimationFrame(()=>{ replaceTextarea(); });
    });

    if("serviceWorker" in navigator){
      navigator.serviceWorker.register("/Notes/sw.js").catch(() => {});
    }
  </script>
</body>
</html>
